[project]
name = "taskmanager"
version = "0.1.0"
description = "Task management GraphQL API (Lush take-home assignment)"
requires-python = ">=3.11"
dependencies = [
  "strawberry-graphql>=0.240,<1",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.30",
  "greenlet>=3.3.0",
  "alembic>=1.14",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Our async SQLAlchemy engine (and its asyncpg connection pool) is created
# once at import time in db/session.py; pytest-asyncio's default per-test
# event loop would create a fresh loop for each test while asyncpg
# connections stay bound to the loop they were opened on, so tests must
# share one session-scoped loop instead.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/taskmanager/db/migrations/versions", "src/taskmanager/db/migrations/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskmanager"]
